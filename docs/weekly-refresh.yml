# INSTALLED at .github/workflows/weekly-refresh.yml (keep this copy identical); Pages source: GitHub Actions.
# Approved job-scoped permissions for the public dashboard repository only.
# Install as .github/workflows/weekly-refresh.yml in the public dashboard repository.
# Official artifact deployment is explicit; nothing is committed to git: the site is rebuilt as the Pages artifact
# from the repository's UI sources plus the run's staged data, and the previous state is read from the github-pages
# artifact of this workflow's newest successful run (retained 30 days), never from the Pages CDN.
name: Daily public feed refresh
on:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    # A merged UI/source change re-publishes the last published data with the new UI (validate-current); no new data is read.
    paths:
      - index.html
      - app.js
      - style.css
      - llms.txt
      - docs/agent-feed.md
      - scripts/**
      - trending/**
      - .github/workflows/weekly-refresh.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh retrieves new feeds; validate-current re-publishes the last published data with the current UI'
        type: choice
        options: [refresh, validate-current]
        default: validate-current
      max_pages:
        description: 'Per-period safety bound; a reached bound never publishes partial data'
        type: string
        default: '1000'
      depth:
        description: 'Rows per period: all (whole feed) or a multiple of 100 (bounded, read twice)'
        type: string
        default: 'all'
      verify_top:
        description: 'Rows per period read twice and published only when both reads agree (multiple of 100, 100..10000)'
        type: string
        default: '2000'
      top:
        description: 'Legacy alias for depth=N verify_top=N; 0 reads the whole feed under the strict rule; empty uses depth/verify_top'
        type: string
        default: ''
      bootstrap_from_live:
        description: 'One-time: when no successful run has a readable github-pages artifact, read the previous publication from the live site'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-feed-publication
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    if: github.repository == 'neo-giga/star-growth-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Neo approved this narrow publication bundle; no personal token is required and nothing writes to the repository.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Unit checks (no network fixtures)
        run: python3 -m unittest discover -s tests
      - name: Stage validated site without changing current files
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'validate-current') || 'refresh' }}
          MAX_PAGES: ${{ inputs.max_pages || '1000' }}
          DEPTH: ${{ inputs.depth || 'all' }}
          VERIFY_TOP: ${{ inputs.verify_top || '2000' }}
          TOP: ${{ inputs.top }}
          BOOTSTRAP: ${{ inputs.bootstrap_from_live && '--bootstrap-from-live' || '' }}
        run: |
          python3 scripts/weekly_refresh.py --site-dir . --output-dir "$RUNNER_TEMP/site" \
            --mode "$MODE" --max-pages "$MAX_PAGES" --depth "$DEPTH" --verify-top "$VERIFY_TOP" ${TOP:+--top "$TOP"} $BOOTSTRAP \
            --checkpoint-dir "$RUNNER_TEMP/checkpoints" --diagnostic "$RUNNER_TEMP/refresh-diagnostic.json"
      - name: Preserve diagnostic and public page checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/refresh-diagnostic.json
            ${{ runner.temp }}/checkpoints
          retention-days: 7
          if-no-files-found: ignore
      - name: Refuse to deploy a stale run
        run: |
          # Deploy only what live main holds: a stale re-run must never roll Pages back to an older UI.
          live="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$live" != "$(git rev-parse HEAD)" ]; then
            echo "main is at $live, not this run's $(git rev-parse HEAD); dispatch a new run" >&2
            exit 1
          fi
      - name: Upload exact staged Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # The durable record of what is published: the next run reads it back for carry-over and re-release.
          retention-days: 30
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4
